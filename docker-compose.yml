version: "3.9"

services:
  api:
    build:
      context: .

      dockerfile: Dockerfile.api

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

  dashboard:
    build:
      context: .

      dockerfile: Dockerfile.dashboard

    ports:
      - "8050:8050"

    depends_on:
      - api

    env_file:
      - .env

    restart: unless-stopped
